name: Generate Git-Koi Graph

on:
  schedule:
    # Runs automatically every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Enables manual trigger from the GitHub Actions UI
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # grants write permission to commit back to your repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required to read commit history

      - name: Generate Git-Koi SVG
        uses: yalongwastaken/git-koi@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push generated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add git-koi.svg || true
          git commit -m "chore: update git-koi graph [skip ci]" || exit 0
          git push