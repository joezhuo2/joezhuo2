name: Generate Git Koi

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch:      # Allows manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Git Koi
        uses: yalongwastaken/git-koi@main
        with:
          login: ${{ github.repository_owner }}
          body: white # Options: white, black, asagi, tea, gold, platinum
          output-dir: koi

      - name: Crop koi to the fish
        run: |
          crop=$(ffmpeg -i koi/koi.gif -vf "format=rgba,alphaextract,cropdetect=limit=0.05:round=2:reset=0" -f null - 2>&1 | grep -o 'crop=[0-9:]*' | tail -1)
          ffmpeg -y -i koi/koi.gif -filter_complex "$crop,split[a][b];[a]palettegen=reserve_transparent=1[p];[b][p]paletteuse" koi/koi-crop.gif

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add koi/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update git-koi profile art" && git push)