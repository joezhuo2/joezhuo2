name: Generate Git-Koi Graph

on:
  schedule:
    # Runs every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to commit generated files back to the repository

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history for accurate contribution metrics

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Git-Koi Graph
        uses: yalongwastaken/git-koi@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update git-koi graph [skip ci]"
          file_pattern: "*.svg *.png"